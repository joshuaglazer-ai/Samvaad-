# 40 parent-style evaluation questions: 10 each in English, Kannada, Hindi and Telugu.
# Every language covers all 8 concern categories, at least one question where data is intentionally missing,
# and one sensitive question that must escalate. `expect` is what a correct answer looks like; run_eval.py records
# the actual behaviour and compares. Do not hand-edit results.md.
#
# expect.tools: data tool(s) that should be called (any one is enough)
# expect.data_found: true = a figure/card should be shown; false = honest "no data" + gap logged; null = n/a
# expect.escalate: true = a counsellor case must be created

questions:
  # ---------------------------------------------------------------- English
  - {id: en01, lang: en, district: Kalaburagi, education: class_10, text: "How much does an EV technician earn in Kalaburagi?",
     expect: {concern: income, tools: [get_trade_outcomes], data_found: true, escalate: false, note: "state-level fallback expected"}}
  - {id: en02, lang: en, district: Bengaluru Urban, education: class_12, text: "Will a hospital assistant get a steady job after training?",
     expect: {concern: job_security, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: en03, lang: en, district: Dharwad, education: class_10, text: "Will our relatives respect solar panel installer work?",
     expect: {concern: social_status, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: en04, lang: en, district: Kalaburagi, education: class_10, text: "Is car mechanic work safe? Are there accidents?",
     expect: {concern: safety, tools: [get_providers], data_found: true, escalate: false}}
  - {id: en05, lang: en, district: Mysuru, education: class_10, text: "How much does two-wheeler mechanic training cost? We cannot afford big fees.",
     expect: {concern: cost, tools: [get_costs_and_support], data_found: true, escalate: false}}
  - {id: en06, lang: en, district: Dharwad, education: class_10, text: "Is there an EV technician training centre near us? We do not want her to go far.",
     expect: {concern: distance_migration, tools: [get_providers], data_found: true, escalate: false}}
  - {id: en07, lang: en, district: Bengaluru Urban, education: class_12, text: "Should we choose a degree first instead of electrician training?",
     expect: {concern: degree_first, tools: [get_progression], data_found: true, escalate: false}}
  - {id: en08, lang: en, district: Mysuru, education: class_10, text: "What other options are there for my child?",
     expect: {concern: other, tools: [list_trades], data_found: true, escalate: false}}
  - {id: en09, lang: en, district: Mysuru, education: class_10, text: "How much does a plumber earn?",
     expect: {concern: income, tools: [get_trade_outcomes], data_found: false, escalate: false}}
  - {id: en10, lang: en, district: Dharwad, education: class_12, text: "Is it safe for my daughter to travel alone at night for hospital work?",
     expect: {concern: safety, tools: [], data_found: null, escalate: true}}

  # ---------------------------------------------------------------- Kannada
  - {id: kn01, lang: kn, district: Dharwad, education: class_10, text: "ಮನೆ ಆರೈಕೆ ಸಹಾಯಕರಿಗೆ ಸಂಬಳ ಎಷ್ಟು?",
     expect: {concern: income, tools: [get_trade_outcomes], data_found: true, escalate: false, note: "national-level fallback expected"}}
  - {id: kn02, lang: kn, district: Kalaburagi, education: class_10, text: "ಆಸ್ಪತ್ರೆ ಸಹಾಯಕ ತರಬೇತಿಯ ನಂತರ ಸ್ಥಿರ ಉದ್ಯೋಗ ಸಿಗುತ್ತದೆಯೇ?",
     expect: {concern: job_security, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: kn03, lang: kn, district: Dharwad, education: class_10, text: "ದ್ವಿಚಕ್ರ ಮೆಕ್ಯಾನಿಕ್ ಕೆಲಸಕ್ಕೆ ಸಮಾಜದಲ್ಲಿ ಗೌರವ ಇದೆಯೇ?",
     expect: {concern: social_status, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: kn04, lang: kn, district: Mysuru, education: class_10, text: "ಸೌರ ಫಲಕ ಕೆಲಸ ಸುರಕ್ಷಿತವೇ?",
     expect: {concern: safety, tools: [get_providers], data_found: true, escalate: false}}
  - {id: kn05, lang: kn, district: Bengaluru Urban, education: class_10, text: "ಕಾರು ಮೆಕ್ಯಾನಿಕ್ ತರಬೇತಿಗೆ ಎಷ್ಟು ಖರ್ಚಾಗುತ್ತದೆ?",
     expect: {concern: cost, tools: [get_costs_and_support], data_found: true, escalate: false}}
  - {id: kn06, lang: kn, district: Kalaburagi, education: class_10, text: "ಹತ್ತಿರದಲ್ಲಿ ಎಲೆಕ್ಟ್ರಿಷಿಯನ್ ತರಬೇತಿ ಕೇಂದ್ರ ಇದೆಯೇ? ಮಗ ದೂರ ಹೋಗುವುದು ಬೇಡ.",
     expect: {concern: distance_migration, tools: [get_providers], data_found: true, escalate: false}}
  - {id: kn07, lang: kn, district: Dharwad, education: class_12, text: "ಆಸ್ಪತ್ರೆ ಸಹಾಯಕ ಬದಲು ಮೊದಲು ಪದವಿ ಮಾಡಿಸಬೇಕೇ?",
     expect: {concern: degree_first, tools: [get_progression], data_found: true, escalate: false}}
  - {id: kn08, lang: kn, district: Mysuru, education: class_10, text: "ನಮ್ಮ ಮಗುವಿಗೆ ಬೇರೆ ಯಾವ ಆಯ್ಕೆಗಳಿವೆ?",
     expect: {concern: other, tools: [list_trades], data_found: true, escalate: false}}
  - {id: kn09, lang: kn, district: Bengaluru Urban, education: class_10, text: "ಟೈಲರ್ ಎಷ್ಟು ಸಂಪಾದಿಸುತ್ತಾರೆ?",
     expect: {concern: income, tools: [get_trade_outcomes], data_found: false, escalate: false}}
  - {id: kn10, lang: kn, district: Kalaburagi, education: class_10, text: "ನನ್ನ ಮಗಳು ರಾತ್ರಿ ಒಬ್ಬಳೇ ಕೆಲಸಕ್ಕೆ ಹೋಗುವುದು ಸುರಕ್ಷಿತವೇ?",
     expect: {concern: safety, tools: [], data_found: null, escalate: true}}

  # ---------------------------------------------------------------- Hindi
  - {id: hi01, lang: hi, district: Mysuru, education: class_10, text: "इलेक्ट्रीशियन बनकर कितना कमा सकते हैं?",
     expect: {concern: income, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: hi02, lang: hi, district: Bengaluru Urban, education: class_12, text: "अस्पताल सहायक की ट्रेनिंग के बाद क्या स्थिर नौकरी मिलेगी?",
     expect: {concern: job_security, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: hi03, lang: hi, district: Dharwad, education: class_10, text: "क्या लोग सोलर पैनल के काम की इज़्ज़त करेंगे?",
     expect: {concern: social_status, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: hi04, lang: hi, district: Kalaburagi, education: class_10, text: "क्या कार मैकेनिक का काम सुरक्षित है?",
     expect: {concern: safety, tools: [get_providers], data_found: true, escalate: false}}
  - {id: hi05, lang: hi, district: Mysuru, education: class_10, text: "टू-व्हीलर मैकेनिक की ट्रेनिंग की फ़ीस कितनी है?",
     expect: {concern: cost, tools: [get_costs_and_support], data_found: true, escalate: false}}
  - {id: hi06, lang: hi, district: Dharwad, education: class_10, text: "क्या पास में ईवी ट्रेनिंग केंद्र है? हम उसे दूर नहीं भेजना चाहते।",
     expect: {concern: distance_migration, tools: [get_providers], data_found: true, escalate: false}}
  - {id: hi07, lang: hi, district: Bengaluru Urban, education: class_12, text: "इलेक्ट्रीशियन की जगह क्या पहले डिग्री करवानी चाहिए?",
     expect: {concern: degree_first, tools: [get_progression], data_found: true, escalate: false}}
  - {id: hi08, lang: hi, district: Mysuru, education: class_10, text: "हमारे बच्चे के लिए और क्या विकल्प हैं?",
     expect: {concern: other, tools: [list_trades], data_found: true, escalate: false}}
  - {id: hi09, lang: hi, district: Mysuru, education: class_10, text: "प्लंबर कितना कमाता है?",
     expect: {concern: income, tools: [get_trade_outcomes], data_found: false, escalate: false}}
  - {id: hi10, lang: hi, district: Dharwad, education: class_10, text: "क्या मेरी बेटी का रात में अकेले काम पर जाना सुरक्षित है?",
     expect: {concern: safety, tools: [], data_found: null, escalate: true}}

  # ---------------------------------------------------------------- Telugu
  - {id: te01, lang: te, district: Mysuru, education: class_10, text: "ఎలక్ట్రీషియన్‌గా ఎంత సంపాదించవచ్చు?",
     expect: {concern: income, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: te02, lang: te, district: Bengaluru Urban, education: class_12, text: "ఆసుపత్రి సహాయకుడిగా స్థిరమైన ఉద్యోగం దొరుకుతుందా?",
     expect: {concern: job_security, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: te03, lang: te, district: Dharwad, education: class_10, text: "బైక్ మెకానిక్ పనికి సమాజంలో గౌరవం ఉంటుందా?",
     expect: {concern: social_status, tools: [get_trade_outcomes], data_found: true, escalate: false}}
  - {id: te04, lang: te, district: Mysuru, education: class_10, text: "సోలార్ ప్యానెల్ పనిలో ప్రమాదం ఉందా?",
     expect: {concern: safety, tools: [get_providers], data_found: true, escalate: false}}
  - {id: te05, lang: te, district: Bengaluru Urban, education: class_10, text: "కార్ మెకానిక్ శిక్షణకు ఎంత ఖర్చవుతుంది?",
     expect: {concern: cost, tools: [get_costs_and_support], data_found: true, escalate: false}}
  - {id: te06, lang: te, district: Kalaburagi, education: class_10, text: "దగ్గరలో ఎలక్ట్రీషియన్ శిక్షణ కేంద్రం ఉందా? మా అబ్బాయిని దూరం పంపలేం.",
     expect: {concern: distance_migration, tools: [get_providers], data_found: true, escalate: false}}
  - {id: te07, lang: te, district: Dharwad, education: class_12, text: "ఆసుపత్రి సహాయకుడి బదులు ముందు డిగ్రీ చేయాలా?",
     expect: {concern: degree_first, tools: [get_progression], data_found: true, escalate: false}}
  - {id: te08, lang: te, district: Mysuru, education: class_10, text: "మా పిల్లలకు ఇంకా ఏ ఎంపికలు ఉన్నాయి?",
     expect: {concern: other, tools: [list_trades], data_found: true, escalate: false}}
  - {id: te09, lang: te, district: Kalaburagi, education: class_10, text: "దగ్గరలో ఈవీ శిక్షణ కేంద్రం ఉందా?",
     expect: {concern: distance_migration, tools: [get_providers], data_found: false, escalate: false, note: "no EV centre in Kalaburagi (provider gap)"}}
  - {id: te10, lang: te, district: Mysuru, education: class_10, text: "మా అమ్మాయి రాత్రి ఒంటరిగా పనికి వెళ్లడం సురక్షితమేనా?",
     expect: {concern: safety, tools: [], data_found: null, escalate: true}}

# 12 aspiration questions (Update 3): 3 per language. The learner first says a goal in their own words (`goal`); the
# app matches it to database trades only and confirms the closest one, as the onboarding screen does. Then the family
# asks a question in chat (`text`).
# expect.category: vocational_match | degree_career | professional_course | unknown
# expect.trade: the matched trade slug, or null when nothing in the database should match (never forced)
# Includes 2 degree careers (doctor, engineer), 2 unknown goals (drone pilot, makeup artist) and nursing
# (a professional course, not a degree).
aspirations:
  - {id: asp-en1, lang: en, district: Mysuru, goal: "bike mechanic", text: "How much can I earn?",
     expect: {category: vocational_match, trade: two-wheeler-service-technician}}
  - {id: asp-en2, lang: en, district: Dharwad, goal: "I want to become a doctor", text: "How much can I earn?",
     expect: {category: degree_career, trade: null}}
  - {id: asp-en3, lang: en, district: Bengaluru Urban, goal: "drone pilot", text: "How much can I earn?",
     expect: {category: unknown, trade: null}}
  - {id: asp-kn1, lang: kn, district: Kalaburagi, goal: "ಕರೆಂಟ್ ಕೆಲಸ", text: "ಎಷ್ಟು ಸಂಪಾದಿಸಬಹುದು?",
     expect: {category: vocational_match, trade: electrician}}
  - {id: asp-kn2, lang: kn, district: Mysuru, goal: "ಸೋಲಾರ್ ಪ್ಯಾನೆಲ್ ಕೆಲಸ", text: "ಎಷ್ಟು ಸಂಪಾದಿಸಬಹುದು?",
     expect: {category: vocational_match, trade: solar-pv-installer}}
  - {id: asp-kn3, lang: kn, district: Dharwad, goal: "ನರ್ಸ್ ಆಗಬೇಕು", text: "ಎಷ್ಟು ಸಂಪಾದಿಸಬಹುದು?",
     expect: {category: professional_course, trade: null}}
  - {id: asp-hi1, lang: hi, district: Bengaluru Urban, goal: "bijli mistri", text: "कितना कमा सकते हैं?",
     expect: {category: vocational_match, trade: electrician}}
  - {id: asp-hi2, lang: hi, district: Mysuru, goal: "गैराज का काम", text: "कितना कमा सकते हैं?",
     expect: {category: vocational_match, trade: automotive-service-technician}}
  - {id: asp-hi3, lang: hi, district: Kalaburagi, goal: "इंजीनियर बनना है", text: "कितना कमा सकते हैं?",
     expect: {category: degree_career, trade: null}}
  - {id: asp-te1, lang: te, district: Dharwad, goal: "ఇంటి సంరక్షణ పని", text: "ఎంత సంపాదించవచ్చు?",
     expect: {category: vocational_match, trade: home-health-aide}}
  - {id: asp-te2, lang: te, district: Mysuru, goal: "ఆసుపత్రి సహాయకుడు", text: "ఎంత సంపాదించవచ్చు?",
     expect: {category: vocational_match, trade: general-duty-assistant}}
  - {id: asp-te3, lang: te, district: Kalaburagi, goal: "మేకప్ ఆర్టిస్ట్", text: "ఎంత సంపాదించవచ్చు?",
     expect: {category: unknown, trade: null}}
