<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6B4FC4" />
    <meta name="description" content="SAMVAAD — Guiding Families. Empowering Futures. Career guidance for learners and parents together." />
    <link rel="icon" type="image/svg+xml" href="/icons/star.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>SAMVAAD</title>
    <script>
      // Apply the saved or system theme before first paint (no light flash in dark mode).
      (function () {
        var t = null;
        try { t = localStorage.getItem("samvaad.theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") {
          try { t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { t = "light"; }
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
